<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>AES ZIP</title>

    <script src="./zip.min.js"></script>

    <style>
        body {
            background: #111827;
            color: #fff;
            font-family: -apple-system, sans-serif;
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }

        .card {
            background: #1f2937;
            padding: 20px;
            border-radius: 12px;
        }

        input {
            width: 100%;
            margin: 10px 0;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #374151;
            background: #374151;
            color: #fff;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: #fff;
            border: 0;
            border-radius: 8px;
        }

        #status {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="card">

        <h2>建立 AES 密碼 ZIP</h2>

        <input type="file" id="files" multiple>

        <input type="password" id="password" placeholder="密碼">

        <button id="createBtn">
            建立 ZIP
        </button>

        <div id="status"></div>

    </div>

    <script>

        const statusEl =
            document.getElementById("status");

        document
            .getElementById("createBtn")
            .addEventListener(
                "click",
                createZip
            );

        async function createZip() {

            const files =
                document.getElementById("files").files;

            const password =
                document.getElementById("password").value;

            if (!files.length) {

                alert("選擇檔案");

                return;
            }

            if (!password) {

                alert("輸入密碼");

                return;
            }

            statusEl.textContent =
                "建立中...";

            const blobWriter =
                new zip.BlobWriter(
                    "application/zip"
                );

            const writer =
                new zip.ZipWriter(
                    blobWriter,
                    {
                        password,
                        encryptionStrength: 3
                    }
                );

            for (const file of files) {

                await writer.add(
                    file.name,
                    new zip.BlobReader(file)
                );
            }

            const blob =
                await writer.close();

            const url =
                URL.createObjectURL(blob);

            const a =
                document.createElement("a");

            document.body.appendChild(a);

            a.href = url;

            a.download =
                "encrypted.zip";

            a.click();

            setTimeout(() => {

                URL.revokeObjectURL(url);

                a.remove();

            }, 1000);

            statusEl.textContent =
                "完成";
        }
    </script>

</body>

</html>
